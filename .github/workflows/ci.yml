name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy values so Vite build can resolve required VITE_* vars
      VITE_API_URL: https://example.com
      VITE_BACKEND_URL: http://localhost:8000
      VITE_CLOUDINARY_UPLOAD_URL: https://api.cloudinary.com/v1_1/demo/image/upload
      VITE_CLOUDINARY_CLOUD_NAME: demo
      VITE_CLOUDINARY_UPLOAD_PRESET: demo
      VITE_ACCESS_TOKEN_KEY: access_token
      VITE_REFRESH_TOKEN_KEY: refresh_token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
